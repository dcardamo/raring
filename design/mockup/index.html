<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F1A">
<title>Raring mockup</title>
<style>
@font-face{font-family:Inter;src:url(https://cdn.jsdelivr.net/fontsource/fonts/inter:vf@latest/latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:Outfit;src:url(https://cdn.jsdelivr.net/fontsource/fonts/outfit:vf@latest/latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:block}
:root{
  --bg:#0B0F1A;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.07);
  --text:#EEF1F7;--text2:#B4BCCB;--text3:#8E98AC;
  --mint:#3DDC97;--amber:#FFB547;--coral:#FF6B6B;--violet:#9B8CFF;--flame:#FF8A3D;--sky:#5CC8FF;
  --good:#3DDC97;--fair:#FFB547;--poor:#FF6B6B;--amount:#5CA8FF;--ink:#E4E8F0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#04060B}
body{color:var(--text);font:400 14px/1.35 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.n{font-family:Outfit,Inter,sans-serif;font-variant-numeric:tabular-nums}
.gallery{display:flex;flex-wrap:wrap;gap:56px 40px;justify-content:center;padding:44px 32px 64px}
.frame{display:flex;flex-direction:column;align-items:center;gap:16px}
.frame>h2{font:600 13px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--text3)}
.phone{width:390px;height:844px;border-radius:50px;background:var(--bg);position:relative;overflow:hidden;
  box-shadow:0 0 0 9px #141824,0 0 0 10px #2A3040,0 40px 90px rgba(0,0,0,.55)}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:52px 16px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.glow{position:absolute;left:50%;top:-200px;width:680px;height:560px;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side,var(--glow),transparent 72%)}
.sb{position:absolute;top:0;left:0;right:0;z-index:6;height:52px;display:flex;align-items:center;justify-content:space-between;padding:8px 22px 0;font:600 15px Inter;background:linear-gradient(to bottom,rgba(11,15,26,.92) 55%,rgba(11,15,26,0))}
.sb .ic{display:flex;gap:6px;align-items:center}
header.top{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 4px 10px;position:relative}
.eyebrow{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
h1{font:600 30px/1.1 Outfit,Inter;margin-top:4px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2B3350,#1A2036);display:grid;place-items:center;font:600 14px Outfit;color:var(--text2);border:1px solid var(--line)}
.back{display:flex;align-items:center;gap:2px;color:var(--text2);font:500 14px Inter;background:none;border:0;cursor:pointer;margin:6px 0 2px -4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px;position:relative}
.card h3{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;min-height:22px}
.row{display:flex;gap:12px;margin-top:12px}
.row>.card{flex:1;margin-top:0;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font:600 12px Inter;letter-spacing:0;text-transform:none;background:rgba(255,255,255,.07);color:var(--text2);white-space:nowrap}
.pill.ok{background:rgba(61,220,151,.14);color:var(--mint)}
.pill.warn{background:rgba(255,181,71,.15);color:var(--amber)}
.pill.flame{background:rgba(255,138,61,.15);color:var(--flame)}
.pill.violet{background:rgba(155,140,255,.16);color:#B9AEFF}
.pill svg{width:13px;height:13px}
.tap{cursor:pointer}
/* dials */
.dials{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 0;position:relative}
.dial{position:relative;display:grid;place-items:center}
.dial-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial-c b{font-weight:600;line-height:1}
.dial-c span{font:600 10px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin-top:5px}
.dial-c em{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;font-style:normal;margin-top:4px}
.dial.sm b{font-size:27px}
.dial.lg b{font-size:52px}
.dial.lg{top:-8px}
.headline{text-align:center;margin:6px 0 4px;position:relative}
.headline h2{font:600 26px/1.15 Outfit,Inter}
.chips{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font:500 13px Inter;color:var(--text2)}
.chip b{color:var(--text);font-weight:600;font-size:14px}
.chip svg{width:15px;height:15px}
/* factors */
.factors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 14px}
.f span{font:500 12px Inter;color:var(--text2);display:flex;justify-content:space-between}
.f span b{font:600 12px Outfit;color:var(--text)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
/* effort */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg span{height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--text3);font:600 13px Inter}
.seg span.on{background:var(--ink);color:#0B0F1A}
.sub{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--text2);font-size:13px}
.sub svg{width:15px;height:15px;color:var(--mint)}
/* body battery + hrv */
.big{font:600 34px/1 Outfit,Inter}
.unit{font:500 13px Inter;color:var(--text3);margin-left:3px}
.bb{display:flex;align-items:center;gap:14px}
.batt{width:30px;height:56px;border-radius:8px;border:2px solid rgba(255,255,255,.18);padding:3px;display:flex;align-items:flex-end;position:relative}
.batt:before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:4px;border-radius:2px 2px 0 0;background:rgba(255,255,255,.18);transform:translateX(-50%)}
.batt i{display:block;width:100%;border-radius:4px;background:var(--good)}
.small{font:500 12px Inter;color:var(--text2);margin-top:6px}
.small b{color:var(--mint);font-weight:600}
/* vitals strip */
.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.v .ring{width:44px;height:44px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;background:rgba(61,220,151,.10);box-shadow:inset 0 0 0 2px rgba(61,220,151,.55);color:var(--mint)}
.v .ring svg{width:20px;height:20px}
.v b{display:block;font:600 16px Outfit}
.v span{font:500 11px Inter;color:var(--text3)}
/* activity */
.act{display:flex;align-items:center;gap:12px}
.act-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06);color:var(--text)}
.act-ico svg{width:24px;height:24px}
.act-main{flex:1;min-width:0}
.act-main b{display:block;font:600 16px Inter}
.act-main span{font-size:13px;color:var(--text2)}
.act-load{text-align:right}
.act-load b{display:block;font:600 24px/1 Outfit}
.act-load span{font:600 10px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.zbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:14px}
.zbar i{display:block;height:100%}
.tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
/* fitness age small */
.fa{display:flex;align-items:center;justify-content:space-between}
.fa .big{font-size:44px}
/* sleep */
.sleep-hero{display:flex;align-items:center;gap:14px;margin-top:4px;position:relative}
.need{flex:1}
.need .big{font-size:40px}
.needbar{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.07);margin:12px 0 8px}
.needbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:rgba(228,232,240,.8)}
.needbar u{position:absolute;top:-5px;bottom:-5px;width:2px;background:#fff;border-radius:1px}
.need-sub{font-size:13px;color:var(--text2)}
.need-sub b{color:var(--text);font:600 14px Outfit}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:14px}
.leg{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg div{flex:1;display:flex;justify-content:space-between;align-items:baseline}
.leg span{font-size:13px;color:var(--text2)}
.leg b{font:600 15px Outfit}
.leg em{font:600 11px Inter;font-style:normal;margin-left:6px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:rgba(255,255,255,.035);border-radius:16px;padding:12px}
.tile span{font:500 12px Inter;color:var(--text3);display:flex;align-items:center;gap:6px}
.chip>svg{color:var(--text3)}
.tile span svg{width:14px;height:14px}
.tile b{display:block;font:600 22px/1.2 Outfit;margin:4px 0 2px}
.tile b small{font:500 12px Inter;color:var(--text3);margin-left:3px}
.tonight{display:flex;align-items:center;gap:14px}
.tonight .moon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--text2)}
.tonight .moon svg{width:24px;height:24px}
.tonight b{font:600 22px Outfit}
.tonight span{display:block;font-size:13px;color:var(--text2)}
/* training */
.semi{position:relative;height:186px;display:flex;justify-content:center;overflow:hidden;margin-top:4px}
.semi .dial-c{top:58px;bottom:auto}
.semi .dial-c b{font-size:46px}
.semi-l{position:absolute;bottom:2px;font:600 10px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.wk{display:flex;justify-content:space-between;align-items:flex-end;height:110px;gap:8px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.wk i{display:block;width:100%;border-radius:8px 8px 4px 4px;min-height:4px}
.wk b{font:600 11px Outfit;color:var(--text2)}
.wk span{font:600 11px Inter;color:var(--text3)}
.lf{margin-top:14px}
.lf:first-of-type{margin-top:0}
.lf-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text2);margin-bottom:8px}
.lf-top b{font:600 15px Outfit;color:var(--text)}
.lfbar{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.06)}
.lfbar u{position:absolute;top:-3px;bottom:-3px;border:1.5px dashed rgba(255,255,255,.28);border-radius:7px}
.lfbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.race{display:flex;flex-direction:column;gap:9px}
.race div{display:flex;justify-content:space-between;font-size:13px;color:var(--text2)}
.race b{font:600 15px Outfit;color:var(--text)}
.list .item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list .item:first-of-type{border-top:0;padding-top:0}
.list .item .act-main b{font-size:15px}
/* workout */
.wo-hero{display:flex;align-items:center;justify-content:space-between}
.te{display:flex;gap:14px}
.te .dial-c b{font-size:22px}
.te .dial-c span{font-size:9px;margin-top:3px}
.te-l{text-align:center;font:600 11px Inter;margin-top:-6px;color:var(--text2)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.grid3 b{display:block;font:600 21px Outfit}
.grid3 span{font:500 12px Inter;color:var(--text3)}
.zr{display:grid;grid-template-columns:26px 1fr 50px 36px;align-items:center;gap:10px;margin-top:10px;font-size:13px}
.zr:first-of-type{margin-top:0}
.zr b{font:600 13px Outfit;color:var(--text2)}
.zr .zt{font:600 14px Outfit;text-align:right}
.zr .zp{font:500 12px Inter;color:var(--text3);text-align:right}
.zr .bar{margin-top:0;height:10px;border-radius:5px}
.zr .bar i{border-radius:5px}
.sp{display:grid;grid-template-columns:22px 1fr 44px;align-items:center;gap:10px;margin-top:8px;font-size:13px}
.sp:first-of-type{margin-top:0}
.sp span{color:var(--text3);font:600 12px Outfit}
.sp b{font:600 14px Outfit;text-align:right}
.sp .bar{margin-top:0;height:8px}
/* health */
.agebar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(61,220,151,.5),rgba(255,181,71,.35),rgba(255,107,107,.35));margin:34px 6px 26px}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%}
.mk span{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 11px Inter;letter-spacing:.06em}
.mk.fit{background:var(--mint);box-shadow:0 0 0 4px #0B0F1A,0 0 18px rgba(61,220,151,.6)}
.mk.fit span{bottom:24px;color:var(--mint)}
.mk.real{background:#0B0F1A;border:3px solid #fff}
.mk.real span{top:22px;color:var(--text2)}
.lever{display:flex;align-items:center;gap:16px}
.lever .dial-c b{font-size:20px}
.lever b.t{font:600 17px Inter;display:block}
.lever span{font-size:13px;color:var(--text2)}
.lever em{font-style:normal;color:var(--mint);font-weight:600}
.drivers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drv{background:rgba(255,255,255,.035);border-radius:16px;padding:12px}
.drv-top{display:flex;justify-content:space-between;align-items:center;font:500 12px Inter;color:var(--text3)}
.drv-top svg{width:16px;height:16px}
.drv b{display:block;font:600 24px/1.2 Outfit;margin:6px 0 8px}
.drv b small{font:500 12px Inter;color:var(--text3);margin-left:3px}
.vr{display:grid;grid-template-columns:30px 1fr 70px;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.vr:first-of-type{border-top:0;padding-top:2px}
.vr .vi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(61,220,151,.12);color:var(--mint)}
.vr .vi svg{width:16px;height:16px}
.vr-n{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.vr-n span{font-size:13px;color:var(--text2)}
.vr-n b{font:600 16px Outfit}
.vr-n b small{font:500 11px Inter;color:var(--text3);margin-left:2px}
.rb{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.06)}
.rb u{position:absolute;top:0;bottom:0;border-radius:4px;background:rgba(255,255,255,.13)}
.rb i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #10141F}
/* tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:86px;padding:10px 14px 24px;display:flex;justify-content:space-around;
  background:#0B0F1A;border-top:1px solid rgba(255,255,255,.06);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px Inter;color:var(--text3);background:none;border:0;cursor:pointer;width:76px}
.tab.on{color:var(--text)}
.tab svg{width:24px;height:24px}
.tab.on svg{color:var(--text)}
@media (max-width:600px){
  .gallery{display:block;padding:0}
  .frame{display:none}
  .frame.current{display:block}
  .frame>h2{display:none}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .sb{display:none}
  .scroll{padding-top:calc(env(safe-area-inset-top) + 10px)}
  .tabs{padding-bottom:calc(env(safe-area-inset-bottom) + 12px);height:auto}
}
</style>

<body>
<main class="gallery" id="gallery"></main>
<script>
// Color carries meaning or it isn't there. Status: good, fair, poor. Effort: heart-rate zones, cool to hot.
// Amount: one blue, faint to strong. Everything without a judgement is ink.
const C = {good:"#3DDC97", fair:"#FFB547", poor:"#FF6B6B", amount:"#5CA8FF", ink:"#E4E8F0", ink2:"#B4BCCB", text3:"#8E98AC",
  stage:{deep:"#2F6FE0", light:"#5C9BFF", rem:"#A9C8FF", awake:"#E4E8F0"},
  z:["#7D879C", "#5CA8FF", "#FFD666", "#FF9F43", "#FF6B6B"]};

const svgI = (d, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ico = {
  moon: svgI('<path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5a6.6 6.6 0 0 0 10 10z"/>'),
  pulse: svgI('<path d="M3 12h4l2.5-5 4 10 2.5-5H21"/>'),
  flame: svgI('<path d="M12 3c.8 3.2 5 5.3 5 10a5 5 0 0 1-10 0c0-2.3 1.1-3.7 2.2-4.8.2 1.8 1.2 2.8 1.2 2.8C10.4 8 11.4 5.6 12 3z"/>'),
  check: svgI('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  heart: svgI('<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/>'),
  lungs: svgI('<path d="M4 9h10.5a2.8 2.8 0 1 0-2.8-2.8M4 13h14a3 3 0 1 1-3 3M4 17h6"/>'),
  drop: svgI('<path d="M12 3.5s6 6.4 6 10.8a6 6 0 0 1-12 0c0-4.4 6-10.8 6-10.8z"/>'),
  temp: svgI('<path d="M14 14.6V5.5a2 2 0 0 0-4 0v9.1a4 4 0 1 0 4 0z"/><path d="M12 11v6"/>'),
  hrv: svgI('<path d="M3 15c2 0 2-6 4-6s2 9 4 9 2-12 4-12 2 9 4 9h2"/>'),
  run: svgI('<circle cx="14.5" cy="4.5" r="1.8"/><path d="M8 21l3-6 3 2.5V21M6.5 12.5l2-3.5 4-1 3 4 3 .5M11 15l-1.5-3"/>'),
  lift: svgI('<path d="M6 8v8M18 8v8M3.5 10v4M20.5 10v4M6 12h12"/>'),
  bike: svgI('<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l2.5 7M13.5 6h2"/>'),
  bolt: svgI('<path d="M13.5 2.5L5 13.5h6.5l-1 8 8.5-11h-6.5z"/>'),
  gauge: svgI('<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4.5-4.5"/>'),
  clock: svgI('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  scale: svgI('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 10a3 3 0 0 1 6 0M12 10l1.2-1.6"/>'),
  vo2: svgI('<path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/>'),
  back: svgI('<path d="M15 5l-7 7 7 7"/>'),
};

let gid = 0;
// Solid arcs: the color is the status. A band marks a target range in neutral ink.
function arc({size, value, max = 100, stroke = 10, color, band, marker = false, sweep = 270}) {
  const r = (size - stroke) / 2 - 3, c = size / 2, Cc = 2 * Math.PI * r, L = Cc * sweep / 360;
  const rot = 90 + (360 - sweep) / 2, f = Math.max(0, Math.min(1, value / max));
  let s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="overflow:visible"><g transform="rotate(${rot} ${c} ${c})">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${L} ${Cc}"/>`;
  if (band) {
    const b0 = L * band[0] / max, b1 = L * band[1] / max;
    s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="${stroke}" stroke-dasharray="0 ${b0} ${b1 - b0} ${Cc}"/>`;
  }
  if (f > 0) s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${L * f} ${Cc}"/>`;
  s += `</g>`;
  if (marker) {
    const a = (rot + sweep * f) * Math.PI / 180;
    s += `<circle cx="${c + r * Math.cos(a)}" cy="${c + r * Math.sin(a)}" r="${stroke * .62}" fill="#fff" stroke="#0B0F1A" stroke-width="3"/>`;
  }
  return s + "</svg>";
}

function smooth(p) {
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2, t = .18;
    d += `C${(p1[0] + (p2[0] - p0[0]) * t).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) * t).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) * t).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) * t).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

function spark(vals, {w = 120, h = 40, color = C.ink, band, fill = true, sw = 2.2, min, max} = {}) {
  const id = "s" + (++gid), all = vals.concat(band || []);
  const lo = min ?? Math.min(...all), hi = max ?? Math.max(...all), pad = 4;
  const X = i => pad + i * (w - 2 * pad) / (vals.length - 1), Y = v => h - pad - (v - lo) / (hi - lo || 1) * (h - 2 * pad);
  const pts = vals.map((v, i) => [X(i), Y(v)]), d = smooth(pts), [ex, ey] = pts[pts.length - 1];
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible">`;
  if (band) s += `<rect x="0" y="${Y(band[1])}" width="${w}" height="${Y(band[0]) - Y(band[1])}" rx="5" fill="${color}" opacity=".12"/>`;
  if (fill) s += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${X(vals.length - 1)},${h}L${X(0)},${h}Z" fill="url(#${id})"/>`;
  s += `<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="3.6" fill="${color}" stroke="#0B0F1A" stroke-width="2"/>`;
  return s + "</svg>";
}

  const lanes = {awake: 0, rem: 1, light: 2, deep: 3}, names = ["Awake", "REM", "Light", "Deep"], col = C.stage;

  let t = 0, prev = null;
  STAGES.forEach(([st, d]) => {

function hrChart() {

  const bounds = [120, 138, 154, 167];

  const d = "M" + pts.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("L");

  for (let i = 0; i < 9; i++) { const y = 10 + i * 20 + r() * 6; s += `<path d="M-10,${y} C ${W * .3},${y + (r() - .5) * 30} ${W * .6},${y + (r() - .5) * 30} ${W + 10},${y + (r() - .5) * 20}" stroke="rgba(255,255,255,.045)" stroke-width="${1 + r() * 3}" fill="none"/>`; }
  for (let i = 0; i < 8; i++) { const x = 10 + i * 44 + r() * 10; s += `<path d="M${x},-10 C ${x + (r() - .5) * 30},${H * .4} ${x + (r() - .5) * 30},${H * .7} ${x + (r() - .5) * 20},${H + 10}" stroke="rgba(255,255,255,.04)" stroke-width="${1 + r() * 2}" fill="none"/>`; }
  s += `<g transform="translate(16,0)"><path d="M-40,128 C 60,110 110,150 170,132 S 270,90 380,104" stroke="rgba(92,168,255,.14)" stroke-width="16" fill="none" stroke-linecap="round"/>`;
  const p = [[62, 140], [58, 104], [84, 70], [126, 52], [172, 40], [222, 46], [262, 68], [276, 102], [252, 128], [206, 132], [160, 124], [118, 134], [80, 146], [62, 140]];
  s += `<path d="${smooth(p)}" stroke="#E4E8F0" stroke-opacity=".12" stroke-width="12" fill="none" stroke-linecap="round"/><path d="${smooth(p)}" stroke="#E4E8F0" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  s += `<circle cx="62" cy="140" r="7" fill="#E4E8F0" stroke="#0E1424" stroke-width="3"/></g>`;
  return s + "</svg>";
}

  </div>${tabs("training")}`;
}

// Frames are [key, label, render, kind, group]; kind is "phone", "fold" (unfolded) or "desk".
// plan-strength.js adds the weekly plan and strength screens before the gallery renders.
const SCREENS = [["today", "Today", today], ["sleep", "Sleep", sleep], ["training", "Training", training], ["workout", "Workout", workout], ["health", "Health", health]].map(s => [...s, "phone", "Core"]);

function render() {
  const g = document.getElementById("gallery"), q = new URLSearchParams(location.search);
  // ?app#key draws one screen full-window, so resizing walks through phone, unfolded and desktop layouts.
  if (q.has("app")) {
    document.body.classList.add("app");
    const draw = () => {
      const s = SCREENS.find(x => x[0] === location.hash.slice(1) && x[3] === "phone") || SCREENS[0];
      g.innerHTML = `<div class="phone"><div class="cq">${s[2]()}</div></div>`;
    };
    draw(); addEventListener("hashchange", draw);
    g.addEventListener("click", e => { const t = e.target.closest("[data-go]"); if (t) location.hash = t.dataset.go; });
    return;
  }
  const only = q.get("group");
  let group = "";
  g.innerHTML = SCREENS.filter(s => !only || s[4] === only).map(([k, l, f, kind, grp]) => {
    const head = !only && grp !== group ? `<h2 class="group">${group = grp}</h2>` : "";
    const body = kind === "desk" ? `<div class="desk"><div class="titlebar"><i></i><i></i><i></i><span>Raring</span></div><div class="win">${f()}</div></div>`
      : `<div class="phone${kind === "fold" ? " fold" : ""}"><div class="cq">${f()}</div></div>`;
    const tag = kind === "desk" ? " · Desktop" : kind === "fold" ? " · Unfolded" : "";
    return `${head}<section class="frame frame-${kind}${k === "today" && kind === "phone" ? " current" : ""}" data-screen="${kind === "phone" ? k : k + "@" + kind}"><h2>${l}${tag}</h2>${body}</section>`;
  }).join("");
  const show = k => document.querySelectorAll(".frame").forEach(f => f.classList.toggle("current", f.dataset.screen === k));
  if (location.hash.length > 1) show(location.hash.slice(1));
  g.addEventListener("click", e => {
    const t = e.target.closest("[data-go]");
    if (!t || window.innerWidth > 600) return;
    show(t.dataset.go);
    const cur = document.querySelector(".frame.current .scroll"); if (cur) cur.scrollTop = 0;
  });
}
document.addEventListener("DOMContentLoaded", render);
</script>
