[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/dcardamo/raring"
homepage = "https://raring.app"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
