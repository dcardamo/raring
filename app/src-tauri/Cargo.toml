[package]
name = "pepometer-app"
description = "Pepometer: a Whoop-style app for Garmin data"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
name = "pepometer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
pepometer-core = { path = "../../crates/core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
