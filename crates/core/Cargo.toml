[package]
name = "pepometer-core"
description = "Garmin client, storage, sync and rules for Pepometer"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-compat"] }
